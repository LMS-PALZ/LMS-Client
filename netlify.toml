# Admin site ONLY (adminstg) — Netlify UI:
#   Base directory:      (empty = repo root)
#   Package directory:   (empty)
#   Build / Publish:     (empty — set below)
#   Production branch:   dev-admin
#
# Student site MUST use base directory apps/student (not repo root).
# Never set student Package directory to apps/student with empty base.

[build]
  command = "npm ci && npm run build -w @ssu/admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
