# Monorepo — one branch (`dev`), two Netlify sites.
#
# Both sites use THIS file. They differ by environment variables + UI publish path:
#
# STUDENT site (ssustaging):
#   UI Base / Package:  (both empty)
#   UI Publish:         apps/student/.next
#   Env var:            NETLIFY_APP=student
#
# ADMIN site (adminstg):
#   UI Base / Package:  (both empty)
#   UI Publish:         apps/admin/.next
#   Env var:            NETLIFY_APP=admin

[build]
  command = "npm ci && bash scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
