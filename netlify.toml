# Default file at repo root — student portal only.
# Do NOT point the admin Netlify site at repo root without overrides.
# Admin site must use base directory: apps/admin (see apps/admin/netlify.toml).

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
