# Staging (testcnflms.netlify.app) — student portal only.
# Admin and tutor use their own Netlify sites (see apps/admin/netlify.toml, apps/tutor/netlify.toml).

[build]
  base = "/"
  command = "npm install && npm run build -w @ssu/student"

[build.environment]
  NODE_VERSION = "24.14.0"
  NEXT_PUBLIC_APP_ENV = "staging"
  NEXT_PUBLIC_STAGING_URL = "https://testcnflms.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
