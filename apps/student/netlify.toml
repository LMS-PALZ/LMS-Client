# Student portal — branch `dev`
#
# Netlify UI (student site):
#   Base directory:      /  (repo root)
#   Package directory:   apps/student
#   Build command:       (empty)
#   Publish directory:   (empty — set below)
#   Production branch:   dev
#
# Do NOT put admin [build] in the repo root netlify.toml — with Base = /,
# Netlify will read it and deploy the admin app on this site.

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"
  publish = "apps/student/.next"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
