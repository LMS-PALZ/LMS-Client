# Student portal — branch `dev`
#
# Netlify UI (student site):
#   Production branch:   dev
#   Base directory:      (empty = repo root)
#   Package directory:   apps/student
#   Build command:       (empty)
#   Publish directory:   (empty — Next.js plugin handles output)
#   Functions directory: (empty)

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"
  publish = "apps/student/.next"
  ignore = "git diff --quiet $CACHED_COMMIT $COMMIT_REF -- apps/student packages/ package.json package-lock.json turbo.json"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
