# Student portal (branch: dev-student)
#
# Netlify UI — REQUIRED (do not use repo root + package directory):
#   Base directory:      apps/student
#   Package directory:   (MUST be empty — not apps/student)
#   Build command:       (empty)
#   Publish directory:   (empty — never apps/admin/.next)
#   Functions directory: (empty)
#   Production branch:   dev-student
#
# If base is repo root, Netlify also reads /netlify.toml (admin) and deploys the wrong app.

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
