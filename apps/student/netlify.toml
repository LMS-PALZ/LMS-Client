# Student portal (deploy from branch: dev)
#
# Netlify site settings:
#   Base directory:     apps/student
#   Build command:      (leave empty — uses this file)
#   Publish directory:  (leave empty — Next.js plugin handles output)
#   Production branch:  dev
#
# Env (Netlify UI):
#   NEXT_PUBLIC_API_URL=https://base-api.skillscaleup.org
#   NEXT_PUBLIC_LIVE_VIDEO_PROVIDER=jitsi

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
