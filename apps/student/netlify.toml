# Student portal — branch `dev`
#
# Netlify UI (student site):
#   Base directory:      apps/student
#   Package directory:   apps/student   (auto-filled — cannot clear, that's OK)
#   Publish directory:   apps/student/  (auto-filled — OVERRIDDEN below)
#   Functions directory: (auto-filled — plugin handles this)
#   Production branch:   dev
#
# Netlify auto-fills Package/Publish/Functions when Base is set. You cannot clear
# them in the UI. This file overrides the important paths (especially publish).
#
# "Overridden by netlify.toml. Published deploy built with /" in the UI is correct —
# base = "/" runs npm ci from the repo root for the monorepo workspace.

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"
  publish = "apps/student/.next"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
