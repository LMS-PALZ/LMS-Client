# Student portal (branch: dev-student)
#
# Netlify UI:
#   Base directory:      apps/student
#   Package directory:   (not set)
#   Build command:       (empty)
#   Publish directory:   (empty)
#   Functions directory: (empty)

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/student"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
