<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live class</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #242424 !important;
        overflow: hidden;
      }
      #zoom-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #zoom-root > div {
        background-color: transparent !important;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8eaed;
        font:
          14px/1.4 system-ui,
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Connecting to live class...</div>
    <div id="zoom-root"></div>
    <script>
      (function () {
        var ZOOM_SDK_VERSION = "6.2.0";
        var statusEl = document.getElementById("status");
        var rootEl = document.getElementById("zoom-root");
        var joining = false;
        var didJoin = false;
        var clientRef = null;
        var fitObserver = null;
        var observedCard = null;
        var fitFrame = 0;
        var transformedCard = null;
        var treeObserver = null;
        var loggedBackdrop = false;

        function setStatus(message) {
          if (!message) {
            statusEl.hidden = true;
            statusEl.textContent = "";
            return;
          }
          statusEl.hidden = false;
          statusEl.textContent = message;
        }

        function errorMessage(error, stage) {
          var raw =
            (error && (error.reason || error.errorMessage || error.message)) ||
            "";
          if (!raw && error != null) {
            try {
              raw = JSON.stringify(error);
            } catch (e) {
              raw = String(error);
            }
          }
          var base = raw || "Unable to join the Zoom meeting.";
          return stage ? stage + ": " + base : base;
        }

        function isMeetingInProgressError(error) {
          var text = errorMessage(error, "").toLowerCase();
          return (
            text.indexOf("already has other meetings") !== -1 ||
            text.indexOf("meeting in progress") !== -1 ||
            text.indexOf("already in progress") !== -1
          );
        }

        function loadStylesheet(href) {
          return new Promise(function (resolve, reject) {
            if (document.querySelector('link[href="' + href + '"]')) {
              resolve();
              return;
            }
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            link.onload = function () {
              resolve();
            };
            link.onerror = function () {
              reject(new Error("Failed to load stylesheet " + href));
            };
            document.head.appendChild(link);
          });
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            if (document.querySelector('script[src="' + src + '"]')) {
              resolve();
              return;
            }
            var script = document.createElement("script");
            script.src = src;
            script.async = true;
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error("Failed to load script " + src));
            };
            document.body.appendChild(script);
          });
        }

        async function loadZoomSdk() {
          if (window.ZoomMtgEmbedded) return window.ZoomMtgEmbedded;
          var base = "https://source.zoom.us/" + ZOOM_SDK_VERSION;
          await loadStylesheet(base + "/ui/zoom-meetingsdk.css");
          await loadScript(base + "/lib/vendor/react.min.js");
          await loadScript(base + "/lib/vendor/react-dom.min.js");
          await loadScript(base + "/lib/vendor/redux.min.js");
          await loadScript(base + "/lib/vendor/redux-thunk.min.js");
          await loadScript(base + "/lib/vendor/lodash.min.js");
          await loadScript(
            base + "/zoom-meeting-embedded-" + ZOOM_SDK_VERSION + ".min.js",
          );
          if (!window.ZoomMtgEmbedded) {
            throw new Error("Zoom Meeting SDK failed to load.");
          }
          return window.ZoomMtgEmbedded;
        }

        function resetZoomRoot() {
          stopFitting();
          var next = document.createElement("div");
          next.id = "zoom-root";
          rootEl.replaceWith(next);
          rootEl = next;
        }

        function forceCleanup(zoomSdk) {
          try {
            if (clientRef && typeof clientRef.leaveMeeting === "function") {
              clientRef.leaveMeeting();
            }
          } catch (e) {}
          try {
            if (zoomSdk && typeof zoomSdk.destroyClient === "function") {
              zoomSdk.destroyClient();
            } else if (
              window.ZoomMtgEmbedded &&
              typeof window.ZoomMtgEmbedded.destroyClient === "function"
            ) {
              window.ZoomMtgEmbedded.destroyClient();
            }
          } catch (e) {}
          clientRef = null;
          didJoin = false;
          resetZoomRoot();
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        var CHROME_HEIGHT = 150;
        var GALLERY_ASPECT = 1 / 1.85;
        var SINGLE_VIDEO_ASPECT = 274 / 250;

        function canRenderGallery() {
          return (
            typeof SharedArrayBuffer !== "undefined" &&
            window.crossOriginIsolated !== false
          );
        }

        function galleryAspect() {
          return canRenderGallery() ? GALLERY_ASPECT : SINGLE_VIDEO_ASPECT;
        }

        function resolveViewSize(payload) {
          var availableWidth = Math.floor(
            Number(payload && payload.viewWidth) || rootEl.clientWidth || 960,
          );
          var availableHeight = Math.floor(
            Number(payload && payload.viewHeight) || rootEl.clientHeight || 560,
          );

          var aspect = galleryAspect();
          var widthForHeight = (availableHeight - CHROME_HEIGHT) / aspect;
          var width = clamp(
            Math.floor(Math.min(availableWidth - 12, widthForHeight)),
            320,
            1600,
          );

          return { width: width, height: Math.round(width * aspect) };
        }

        function findZoomCard() {
          var rootWidth = rootEl.clientWidth;
          var rootHeight = rootEl.clientHeight;
          var nodes = rootEl.querySelectorAll("div");
          var best = null;
          var bestArea = 0;

          for (var i = 0; i < nodes.length; i += 1) {
            var el = nodes[i];
            var width = el.offsetWidth;
            var height = el.offsetHeight;
            if (width < 120 || height < 120) continue;
            if (width >= rootWidth - 2 && height >= rootHeight - 2) continue;

            var area = width * height;
            if (area > bestArea) {
              best = el;
              bestArea = area;
            }
          }

          return best;
        }

        function isLightBackground(el) {
          var match = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(
            window.getComputedStyle(el).backgroundColor,
          );
          if (!match) return false;
          var alpha = match[4] === undefined ? 1 : Number(match[4]);
          if (alpha < 0.05) return false;
          var luminance =
            (Number(match[1]) * 299 +
              Number(match[2]) * 587 +
              Number(match[3]) * 114) /
            1000;
          return luminance > 120;
        }

        function clearBackdrops(card) {
          var rootArea = rootEl.clientWidth * rootEl.clientHeight;
          var nodes = rootEl.querySelectorAll("div");

          for (var i = 0; i < nodes.length; i += 1) {
            var el = nodes[i];
            if (el === card || card.contains(el)) continue;

            var covers =
              rootArea > 0 &&
              el.offsetWidth * el.offsetHeight > rootArea * 0.25;
            if (el.contains(card) || (covers && isLightBackground(el))) {
              if (covers && !loggedBackdrop) {
                loggedBackdrop = true;
                console.debug("[zoom-embed] cleared backdrop", el.className);
              }
              el.style.setProperty(
                "background-color",
                "transparent",
                "important",
              );
            }
          }

          if (isLightBackground(card)) {
            card.style.setProperty(
              "background-color",
              "transparent",
              "important",
            );
          }
        }

        function fitZoomCard() {
          var card = findZoomCard();
          if (!card) return;

          clearBackdrops(card);

          if (transformedCard && transformedCard !== card) {
            transformedCard.style.transform = "";
          }
          transformedCard = card;

          card.style.transformOrigin = "center center";
          card.style.transform = "none";

          var cardRect = card.getBoundingClientRect();
          var rootRect = rootEl.getBoundingClientRect();
          if (!cardRect.width || !cardRect.height) return;
          if (!rootRect.width || !rootRect.height) return;

          var scale = clamp(
            Math.min(
              rootRect.width / cardRect.width,
              rootRect.height / cardRect.height,
            ) * 0.995,
            0.4,
            2.2,
          );

          var scaledWidth = cardRect.width * scale;
          var scaledHeight = cardRect.height * scale;
          var currentLeft = cardRect.left + (cardRect.width - scaledWidth) / 2;
          var currentTop = cardRect.top + (cardRect.height - scaledHeight) / 2;
          var dx = Math.round(
            rootRect.left + (rootRect.width - scaledWidth) / 2 - currentLeft,
          );
          var dy = Math.round(
            rootRect.top + (rootRect.height - scaledHeight) / 2 - currentTop,
          );

          if (
            Math.abs(dx) < 2 &&
            Math.abs(dy) < 2 &&
            Math.abs(scale - 1) < 0.01
          ) {
            return;
          }

          card.style.transform =
            "translate(" + dx + "px, " + dy + "px) scale(" + scale + ")";
        }

        function scheduleFit() {
          if (fitFrame) window.cancelAnimationFrame(fitFrame);
          fitFrame = window.requestAnimationFrame(function () {
            fitFrame = 0;
            observeCard();
            fitZoomCard();
          });
        }

        function observeCard() {
          if (!fitObserver) return;
          var card = findZoomCard();
          if (!card || card === observedCard) return;
          if (observedCard) fitObserver.unobserve(observedCard);
          observedCard = card;
          fitObserver.observe(card);
        }

        function startFitting() {
          scheduleFit();

          if (!treeObserver && typeof MutationObserver !== "undefined") {
            treeObserver = new MutationObserver(scheduleFit);
            treeObserver.observe(rootEl, { childList: true, subtree: true });
          }

          if (fitObserver || typeof ResizeObserver === "undefined") return;
          fitObserver = new ResizeObserver(scheduleFit);
          fitObserver.observe(rootEl);
          observeCard();
        }

        function stopFitting() {
          if (fitObserver) {
            fitObserver.disconnect();
            fitObserver = null;
          }
          if (treeObserver) {
            treeObserver.disconnect();
            treeObserver = null;
          }
          observedCard = null;
          transformedCard = null;
          if (fitFrame) {
            window.cancelAnimationFrame(fitFrame);
            fitFrame = 0;
          }
        }

        window.addEventListener("resize", scheduleFit);

        async function joinMeeting(payload, isRetry) {
          if (joining) return;
          joining = true;
          try {
            setStatus("Connecting to live class...");
            var meetingNumber = String(payload.meetingNumber || "").replace(
              /\D/g,
              "",
            );
            var signature = payload.signature;
            var sdkKey = payload.sdkKey;
            var userName =
              String(payload.userName || "Student").trim() || "Student";
            var password =
              payload.password == null ? "" : String(payload.password);

            if (!meetingNumber || !signature) {
              throw new Error("Missing meeting details.");
            }
            if (!sdkKey) {
              throw new Error("Missing Zoom SDK key.");
            }

            var zoomSdk = await loadZoomSdk();
            if (isRetry || clientRef) {
              forceCleanup(zoomSdk);
              await new Promise(function (resolve) {
                window.setTimeout(resolve, isRetry ? 500 : 150);
              });
            }

            var client = zoomSdk.createClient();
            clientRef = client;
            var viewSize = resolveViewSize(payload);

            if (!canRenderGallery()) {
              console.warn(
                "[zoom-embed] Not cross-origin isolated: SharedArrayBuffer is unavailable, so Zoom renders a single video instead of gallery view.",
              );
            }

            parent.postMessage(
              {
                source: "ssu-zoom-embed",
                type: "mode",
                gallery: canRenderGallery(),
              },
              window.location.origin,
            );

            await client.init({
              zoomAppRoot: rootEl,
              language: "en-US",
              patchJsMedia: true,
              leaveOnPageUnload: true,
              maximumVideosInGalleryView: 9,
              customize: {
                video: {
                  isResizable: false,
                  defaultViewType: "gallery",
                  popper: { disableDraggable: true },
                  viewSizes: {
                    default: viewSize,
                    ribbon: {
                      width: viewSize.width,
                      height: clamp(
                        Math.round(viewSize.height * 0.28),
                        120,
                        220,
                      ),
                    },
                  },
                },
              },
            });

            client.on("connection-change", function (event) {
              if (event && event.state === "Closed" && didJoin) {
                didJoin = false;
                stopFitting();
                try {
                  if (window.ZoomMtgEmbedded) {
                    window.ZoomMtgEmbedded.destroyClient();
                  }
                } catch (e) {}
                clientRef = null;
                parent.postMessage(
                  { source: "ssu-zoom-embed", type: "left" },
                  window.location.origin,
                );
              }
            });

            await client.join({
              signature: signature,
              sdkKey: sdkKey,
              meetingNumber: meetingNumber,
              userName: userName,
              password: password,
            });
            didJoin = true;
            setStatus("");
            startFitting();
            window.setTimeout(scheduleFit, 400);
            window.setTimeout(scheduleFit, 1200);
            parent.postMessage(
              { source: "ssu-zoom-embed", type: "joined" },
              window.location.origin,
            );
          } catch (error) {
            if (!isRetry && isMeetingInProgressError(error)) {
              joining = false;
              try {
                if (window.ZoomMtgEmbedded) {
                  forceCleanup(window.ZoomMtgEmbedded);
                }
              } catch (e) {}
              await new Promise(function (resolve) {
                window.setTimeout(resolve, 500);
              });
              return joinMeeting(payload, true);
            }
            var message = errorMessage(error, "Join failed");
            setStatus(message);
            parent.postMessage(
              {
                source: "ssu-zoom-embed",
                type: "error",
                message: message,
                errorCode: error && error.errorCode,
              },
              window.location.origin,
            );
          } finally {
            joining = false;
          }
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          var data = event.data;
          if (!data || data.source !== "ssu-zoom-embed-parent") return;
          if (data.type === "ping") {
            parent.postMessage(
              { source: "ssu-zoom-embed", type: "ready" },
              window.location.origin,
            );
            return;
          }
          if (data.type === "resize") {
            scheduleFit();
            return;
          }
          if (data.type === "join") {
            void joinMeeting(data.payload || {}, false);
          }
        });

        parent.postMessage(
          { source: "ssu-zoom-embed", type: "ready" },
          window.location.origin,
        );
      })();
    </script>
  </body>
</html>
