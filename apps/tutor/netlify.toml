# Tutor portal — deploy from branch `dev` when a tutor Netlify site is set up.
#
# Netlify UI:
#   Production branch:   dev
#   Base directory:      (empty = repo root)
#   Package directory:   apps/tutor
#   Build command:       (empty)
#   Publish directory:   (empty — Next.js plugin handles output)
#   Functions directory: (empty)

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/tutor"
  ignore = "git diff --quiet $CACHED_COMMIT $COMMIT_REF -- apps/tutor packages/ package.json package-lock.json turbo.json"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
