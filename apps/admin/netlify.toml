# Admin portal — branch `dev`
#
# Netlify UI (admin site):
#   Base directory:      (empty = repo root)
#   Package directory:   apps/admin
#   Build command:       (empty)
#   Publish directory:   (empty — set below)
#   Production branch:   dev

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
