# Admin portal (branch: dev-admin)
#
# Netlify UI — use the monorepo layout:
#   Base directory:      /   (repo root — leave empty)
#   Package directory:   apps/admin
#   Build command:       (leave empty)
#   Publish directory:   (leave empty)
#   Functions directory: (leave empty)
#
# Do NOT set publish to apps/admin/.next — paths are relative to package dir.

[build]
  command = "npm ci && npm run build -w @ssu/admin"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
