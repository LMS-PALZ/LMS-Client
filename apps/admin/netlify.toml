# Admin portal (branch: dev-admin)
#
# Netlify UI — match the working student site setup:
#   Base directory:      apps/admin
#   Package directory:   (not set)
#   Build command:       (empty)
#   Publish directory:   (empty)
#   Functions directory: (empty)

[build]
  base = "/"
  command = "npm ci && npm run build -w @ssu/admin"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
