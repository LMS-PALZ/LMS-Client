# Admin portal — Netlify UI (branch: dev-admin):
#   Base directory:      (empty = repo root)
#   Package directory:   apps/admin
#   Build command:       (empty)
#   Publish directory:   (empty — publish is set below, relative to repo root)
#   Functions directory: (empty)
#
# Install "@netlify/plugin-nextjs" under Site configuration → Build plugins if missing.

[build]
  command = "npm ci && npm run build -w @ssu/admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "24.14.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
