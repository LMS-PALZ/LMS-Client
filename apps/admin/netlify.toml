# Admin portal — branch `dev`
#
# Netlify UI (admin site):
#   Production branch:   dev
#   Base directory:      (empty = repo root)
#   Package directory:   apps/admin
#   Build command:       (empty)
#   Publish directory:   (empty — Next.js plugin handles output)
#   Functions directory: (empty)

[build]
  base = "/"
  command = "npm ci --include=dev && npm run build -w @ssu/admin"
  ignore = "git diff --quiet $CACHED_COMMIT $COMMIT_REF -- apps/admin packages/ package.json package-lock.json turbo.json"

[build.environment]
  NODE_VERSION = "24.14.0"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"
